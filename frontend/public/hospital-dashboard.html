<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LifeLink - Hospital Dashboard</title>

  <link rel="stylesheet" href="css/hospital-dashboard.css">
</head>

<body>

  <div class="app">

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar">

<div class="logo">
        <span class="logo-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Blood droplet -->
            <path d="M12 2C12 2 5 10 5 15a7 7 0 0 0 14 0C19 10 12 2 12 2Z" fill="#d71920"/>
            <!-- White heart outline inside the droplet -->
            <path d="M12 19.5C12 19.5 6.2 15 6.2 11.2C6.2 9.1 7.9 7.5 9.9 7.5C10.9 7.5 11.7 7.9 12 8.5C12.3 7.9 13.1 7.5 14.1 7.5C16.1 7.5 17.8 9.1 17.8 11.2C17.8 15 12 19.5 12 19.5Z" stroke="#ffffff" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>LifeLink</span>
      </div>

      <nav class="sidebar-nav">

        <button class="nav-item active" data-page="dashboard">
          <span class="nav-icon">▣</span>
          <span>Dashboard</span>
        </button>

        <button class="nav-item" data-page="create-request">
          <span class="nav-icon">⊞</span>
          <span>Create Request</span>
        </button>

        <button class="nav-item" data-page="my-requests">
          <span class="nav-icon">▤</span>
          <span>My Requests</span>
        </button>

        <button class="nav-item" data-page="responses">
          <span class="nav-icon">♧</span>
          <span>Responses</span>
        </button>

        <button class="nav-item" data-page="profile">
          <span class="nav-icon">♙</span>
          <span>Hospital Profile</span>
        </button>

        <button class="nav-item" data-page="settings">
          <span class="nav-icon">⚙</span>
          <span>Settings</span>
        </button>

      </nav>

      <button class="logout-btn" id="logout-btn">
        <span>↪</span>
        <span>Logout</span>
      </button>

    </aside>


    <!-- ================= MAIN AREA ================= -->
    <main class="main">

      <!-- TOP BAR -->
      <header class="topbar">

        <div></div>

        <div class="hospital-account">

          <div class="hospital-avatar" id="hospital-avatar">H</div>

          <div class="hospital-info">
            <strong id="hospital-name">Hospital</strong>
            <span>Hospital</span>
          </div>

          <button class="account-arrow" id="account-menu-btn">⌄</button>

        </div>

      </header>

      <!-- PAGE CONTENT -->
      <section class="content">

        <!-- DASHBOARD -->
        <div class="page active-page" id="dashboard">

          <div class="page-header">
            <h1>Dashboard</h1>
            <p>Welcome back, <span id="welcome-hospital-name">Hospital</span>!</p>
          </div>

          <!-- STAT CARDS (populated by JS) -->
          <div class="stats-grid">

            <div class="stat-card">
              <div class="stat-icon red">♧</div>
              <div>
                <span>Total Requests</span>
                <strong id="stat-total-requests">—</strong>
                <small>All time</small>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon orange">▣</div>
              <div>
                <span>Active Requests</span>
                <strong id="stat-active-requests">—</strong>
                <small>Currently open</small>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon green">♧</div>
              <div>
                <span>Total Responses</span>
                <strong id="stat-total-responses">—</strong>
                <small>All time</small>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon blue">♙</div>
              <div>
                <span>Completed Donations</span>
                <strong id="stat-completed-donations">—</strong>
                <small>All time</small>
              </div>
            </div>

          </div>


          <!-- DASHBOARD GRID -->
          <div class="dashboard-grid">

            <!-- REQUEST STATUS OVERVIEW -->
            <div class="card status-card">

              <div class="card-header">
                <h2>Request Status Overview</h2>
              </div>

              <div class="status-content">

                <div class="donut-chart">
                  <div class="donut-center">
                    <strong id="status-total">—</strong>
                    <span>Total</span>
                  </div>
                </div>

                <div class="status-legend">

                  <div>
                    <span class="legend-dot red-dot"></span>
                    <span>Active</span>
                    <strong id="status-active">—</strong>
                  </div>

                  <div>
                    <span class="legend-dot orange-dot"></span>
                    <span>In Progress</span>
                    <strong id="status-inProgress">—</strong>
                  </div>

                  <div>
                    <span class="legend-dot green-dot"></span>
                    <span>Completed</span>
                    <strong id="status-completed">—</strong>
                  </div>

                </div>

              </div>

            </div>


            

      </section>


    </main>

  </div>


  <!-- API service layer (placeholder) + dashboard controller -->
  <script src="js/hospital-dashboard.js"></script>

</body>
</html>
