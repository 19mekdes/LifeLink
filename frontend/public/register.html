<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeLink - Register</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../src/css/styles.css" />
    <link rel="stylesheet" href="../src/css/auth.css" />
</head>
<body>
    <!-- ============ MAIN REGISTER CONTAINER ============ -->
    <div class="auth-container">
        <div class="auth-card register-card">
            <!-- Logo -->
            <div class="logo">
                <i class="fas fa-heartbeat"></i>
                <span>LifeLink</span>
            </div>
            
            <h2>Create Account</h2>
            <p class="subtitle">Join the community and help save lives</p>

            <!-- Role Selector -->
            <div class="role-selector">
                <button type="button" class="role-btn active" data-role="DONOR">
                    <i class="fas fa-user"></i> Donor
                </button>
                <button type="button" class="role-btn" data-role="HOSPITAL">
                    <i class="fas fa-hospital"></i> Hospital
                </button>
                <button type="button" class="role-btn" data-role="BLOOD_BANK">
                    <i class="fas fa-warehouse"></i> Blood Bank
                </button>
            </div>

            <!-- Registration Form -->
            <form id="registerForm" novalidate>
                <!-- ===== Common Fields ===== -->
                <div class="form-group">
                    <label for="name">Full Name <span class="required">*</span></label>
                    <input 
                        type="text" 
                        id="name" 
                        class="form-control" 
                        placeholder="Enter your full name" 
                        required 
                    />
                </div>

                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-control" 
                        placeholder="Enter your email" 
                        required 
                    />
                </div>

                <div class="form-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            class="form-control" 
                            placeholder="Minimum 6 characters" 
                            required 
                            minlength="6"
                        />
                        <button type="button" class="password-toggle" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number <span class="required">*</span></label>
                    <input 
                        type="tel" 
                        id="phone" 
                        class="form-control" 
                        placeholder="Enter phone number" 
                        required 
                    />
                </div>

                <!-- ===== Donor Fields ===== -->
                <div id="donorFields" class="role-fields active">
                    <div class="form-group">
                        <label for="age">Age <span class="required">*</span></label>
                        <input 
                            type="number" 
                            id="age" 
                            class="form-control" 
                            placeholder="Enter your age" 
                            min="16" 
                            max="100"
                        />
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender <span class="required">*</span></label>
                        <select id="gender" class="form-control">
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="bloodType">Blood Type <span class="required">*</span></label>
                        <select id="bloodType" class="form-control">
                            <option value="">Select Blood Type</option>
                            <option value="A_POS">A+</option>
                            <option value="A_NEG">A-</option>
                            <option value="B_POS">B+</option>
                            <option value="B_NEG">B-</option>
                            <option value="AB_POS">AB+</option>
                            <option value="AB_NEG">AB-</option>
                            <option value="O_POS">O+</option>
                            <option value="O_NEG">O-</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="address">Address <span class="required">*</span></label>
                        <input 
                            type="text" 
                            id="address" 
                            class="form-control" 
                            placeholder="Enter your address"
                        />
                    </div>

                    <div class="form-group">
                        <label for="city">City <span class="required">*</span></label>
                        <input 
                            type="text" 
                            id="city" 
                            class="form-control" 
                            placeholder="Enter your city"
                        />
                    </div>
                </div>

                <!-- ===== Hospital Fields ===== -->
                <div id="hospitalFields" class="role-fields">
                    <div class="form-group">
                        <label for="hospitalName">Hospital Name <span class="required">*</span></label>
                        <input 
                            type="text" 
                            id="hospitalName" 
                            class="form-control" 
                            placeholder="Enter hospital name"
                        />
                    </div>

                    <div class="form-group">
                        <label for="hospitalLicense">License Number <span class="required">*</span></label>
                        <input 
                            type="text" 
                            id="hospitalLicense" 
                            class="form-control" 
                            placeholder="Enter license number"
                        />
                    </div>

                    <div class="form-group">
                        <label for="hospitalAddress">Address <span class="required">*</span></label>
                        <input 
                            type="text" 
                            id="hospitalAddress" 
                            class="form-control" 
                            placeholder="Enter hospital address"
                        />
                    </div>

                    <div class="form-group">
                        <label for="hospitalCity">City <span class="required">*</span></label>
                        <input 
                            type="text" 
                            id="hospitalCity" 
                            class="form-control" 
                            placeholder="Enter city"
                        />
                    </div>
                </div>

                <!-- ===== Blood Bank Fields ===== -->
                <div id="bloodBankFields" class="role-fields">
                    <div class="form-group">
                        <label for="bankName">Blood Bank Name <span class="required">*</span></label>
                        <input 
                            type="text" 
                            id="bankName" 
                            class="form-control" 
                            placeholder="Enter blood bank name"
                        />
                    </div>

                    <div class="form-group">
                        <label for="bankLicense">License Number <span class="required">*</span></label>
                        <input 
                            type="text" 
                            id="bankLicense" 
                            class="form-control" 
                            placeholder="Enter license number"
                        />
                    </div>

                    <div class="form-group">
                        <label for="bankAddress">Address <span class="required">*</span></label>
                        <input 
                            type="text" 
                            id="bankAddress" 
                            class="form-control" 
                            placeholder="Enter address"
                        />
                    </div>

                    <div class="form-group">
                        <label for="bankCity">City <span class="required">*</span></label>
                        <input 
                            type="text" 
                            id="bankCity" 
                            class="form-control" 
                            placeholder="Enter city"
                        />
                    </div>
                </div>

                <div id="formError" class="error-message"></div>

                <button type="submit" class="btn btn-primary btn-block" id="registerBtn">
                    <i class="fas fa-user-plus"></i> Register
                </button>
            </form>

            <!-- Footer -->
            <div class="auth-footer">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>

    <!-- ============ TOAST CONTAINER ============ -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- ============ IMPORTS ============ -->
    <script type="importmap">
        {
            "imports": {
                "../src/js/api/api.js": "../src/js/api/api.js",
                "../src/js/api/authApi.js": "../src/js/api/authApi.js"
            }
        }
    </script>

    <!-- ============ REGISTER SCRIPT ============ -->
    <script type="module">
        import authApi from '../src/js/api/authApi.js';
        
        // ============ DOM ELEMENTS ============
        const registerForm = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerBtn');
        const formError = document.getElementById('formError');
        const toastContainer = document.getElementById('toastContainer');
        const togglePassword = document.getElementById('togglePassword');

        // ============ ROLE SELECTION ============
        let selectedRole = 'DONOR';
        const roleBtns = document.querySelectorAll('.role-btn');
        const donorFields = document.getElementById('donorFields');
        const hospitalFields = document.getElementById('hospitalFields');
        const bloodBankFields = document.getElementById('bloodBankFields');

        roleBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                roleBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedRole = btn.dataset.role;

                donorFields.classList.remove('active');
                hospitalFields.classList.remove('active');
                bloodBankFields.classList.remove('active');

                if (selectedRole === 'DONOR') {
                    donorFields.classList.add('active');
                } else if (selectedRole === 'HOSPITAL') {
                    hospitalFields.classList.add('active');
                } else if (selectedRole === 'BLOOD_BANK') {
                    bloodBankFields.classList.add('active');
                }
            });
        });

        // ============ TOAST FUNCTION ============
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i>
                <span>${message}</span>
            `;
            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // ============ PASSWORD TOGGLE ============
        if (togglePassword) {
            const passwordInput = document.getElementById('password');
            togglePassword.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                togglePassword.querySelector('i').classList.toggle('fa-eye');
                togglePassword.querySelector('i').classList.toggle('fa-eye-slash');
            });
        }

        // ============ REGISTER FORM SUBMIT ============
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            formError.classList.remove('show');
            formError.textContent = '';
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registering...';

            // Get common fields
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const phone = document.getElementById('phone').value.trim();

            if (!name || !email || !password || !phone) {
                showToast('Please fill in all required fields', 'error');
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Register';
                return;
            }

            if (password.length < 6) {
                showToast('Password must be at least 6 characters', 'error');
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Register';
                return;
            }

            const userData = {
                name,
                email,
                password,
                phone,
                role: selectedRole
            };

            // Add role-specific fields
            if (selectedRole === 'DONOR') {
                const age = document.getElementById('age').value;
                const gender = document.getElementById('gender').value;
                const bloodType = document.getElementById('bloodType').value;
                const address = document.getElementById('address').value.trim();
                const city = document.getElementById('city').value.trim();

                if (!age || !gender || !bloodType || !address || !city) {
                    showToast('Please fill in all donor fields', 'error');
                    registerBtn.disabled = false;
                    registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Register';
                    return;
                }

                Object.assign(userData, {
                    age: parseInt(age),
                    gender,
                    bloodType,
                    address,
                    city
                });
            } else if (selectedRole === 'HOSPITAL') {
                const hospitalName = document.getElementById('hospitalName').value.trim();
                const licenseNumber = document.getElementById('hospitalLicense').value.trim();
                const address = document.getElementById('hospitalAddress').value.trim();
                const city = document.getElementById('hospitalCity').value.trim();

                if (!hospitalName || !licenseNumber || !address || !city) {
                    showToast('Please fill in all hospital fields', 'error');
                    registerBtn.disabled = false;
                    registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Register';
                    return;
                }

                Object.assign(userData, {
                    hospitalName,
                    licenseNumber,
                    address,
                    city
                });
            } else if (selectedRole === 'BLOOD_BANK') {
                const bankName = document.getElementById('bankName').value.trim();
                const licenseNumber = document.getElementById('bankLicense').value.trim();
                const address = document.getElementById('bankAddress').value.trim();
                const city = document.getElementById('bankCity').value.trim();

                if (!bankName || !licenseNumber || !address || !city) {
                    showToast('Please fill in all blood bank fields', 'error');
                    registerBtn.disabled = false;
                    registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Register';
                    return;
                }

                Object.assign(userData, {
                    bankName,
                    licenseNumber,
                    address,
                    city
                });
            }

            try {
                console.log('Registering user:', userData);
                const response = await authApi.register(userData);
                console.log('Registration response:', response);

                if (response.success && response.data) {
                    authApi.saveAuth(response.data.token, response.data.user);
                    showToast(response.message || 'Registration successful! 🎉', 'success');
                    
                    setTimeout(() => {
                        const dashboard = authApi.getDashboardUrl(response.data.user.role);
                        console.log('Redirecting to:', dashboard);
                        window.location.href = dashboard;
                    }, 1500);
                } else {
                    let errorMsg = response.message || 'Registration failed';
                    if (response.errors && response.errors.length > 0) {
                        errorMsg = response.errors.map(e => e.msg).join(', ');
                    }
                    showToast(errorMsg, 'error');
                    formError.textContent = errorMsg;
                    formError.classList.add('show');
                }
            } catch (error) {
                console.error('Registration error:', error);
                showToast('Registration failed. Please try again.', 'error');
                formError.textContent = 'Network error. Please try again.';
                formError.classList.add('show');
            } finally {
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Register';
            }
        });
    </script>
</body>
</html>
